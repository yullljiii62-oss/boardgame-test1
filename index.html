<!DOCTYPE html>


<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 L&D 보드게임 취향 테스트</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffeef8 0%, #e8f4ff 50%, #f0fff4 100%);
      background-size: 300% 300%;
      animation: bgShift 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container { width: 100%; max-width: 580px; }

    /* ── 화면 전환 ── */
    .screen { display: none; }
    .screen.active {
      display: block;
      animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 카드 ── */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: 0 8px 40px rgba(120, 80, 180, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    /* ── 시작 화면 ── */
    .start-icon {
      font-size: 70px;
      text-align: center;
      display: block;
      margin-bottom: 14px;
      animation: floatBounce 2.4s ease-in-out infinite;
    }
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }
    .start-title {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #5c4a8c;
      margin-bottom: 8px;
    }
    .start-sub {
      text-align: center;
      font-size: 14.5px;
      color: #9280b8;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .name-label {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      color: #7c6faa;
      margin-bottom: 8px;
    }
    .name-input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e5d6f7;
      border-radius: 14px;
      font-size: 16px;
      font-family: inherit;
      color: #3d3060;
      background: rgba(255,255,255,0.9);
      outline: none;
      transition: border-color 0.25s;
      margin-bottom: 22px;
    }
    .name-input:focus { border-color: #b99bd6; }
    .name-input.error { border-color: #f9a8d4; }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #c8a5e8 0%, #8ec5fc 100%);
      border: none;
      border-radius: 14px;
      font-size: 16.5px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(176, 137, 220, 0.38);
    }

    /* ── 진행 바 ── */
    .progress-wrap { margin-bottom: 28px; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: #9a8fba;
      margin-bottom: 8px;
    }
    .progress-bg {
      width: 100%;
      height: 10px;
      background: #ede8f5;
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c8a5e8, #8ec5fc, #a8f0db);
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── 질문 화면 ── */
    .q-label {
      font-size: 12.5px;
      font-weight: 500;
      color: #b09fcb;
      margin-bottom: 10px;
    }
    .q-text {
      font-size: 19px;
      font-weight: 700;
      color: #3d3060;
      line-height: 1.55;
      margin-bottom: 26px;
    }
    .options { display: flex; flex-direction: column; gap: 11px; }
    .opt-btn {
      padding: 15px 20px;
      border: 2px solid #e5d6f7;
      border-radius: 14px;
      background: rgba(255,255,255,0.75);
      font-size: 14.5px;
      font-family: inherit;
      color: #4a3f6b;
      cursor: pointer;
      text-align: left;
      line-height: 1.5;
      transition: all 0.22s;
    }
    .opt-btn:hover {
      border-color: #c8a5e8;
      background: rgba(200, 165, 232, 0.13);
      transform: translateX(5px);
    }
    .opt-btn.selected {
      border-color: #c8a5e8;
      background: linear-gradient(135deg, rgba(200,165,232,0.22), rgba(142,197,252,0.22));
      color: #5c4a8c;
      font-weight: 500;
      transform: translateX(5px);
    }

    /* ── 결과 화면 ── */
    .result-top { text-align: center; margin-bottom: 24px; }
    .result-emoji {
      font-size: 76px;
      display: block;
      margin-bottom: 14px;
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .result-name-line { font-size: 15px; color: #9a8fba; margin-bottom: 6px; }
    .result-type { font-size: 25px; font-weight: 700; color: #5c4a8c; margin-bottom: 6px; }
    .result-subtitle { font-size: 13.5px; color: #9280b8; margin-bottom: 14px; }
    .result-game-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ffd6e7, #c7f2ff);
      border-radius: 100px;
      padding: 7px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #5c4a8c;
    }
    .result-desc {
      background: rgba(237,232,245,0.45);
      border-radius: 14px;
      padding: 18px 20px;
      margin: 20px 0;
    }
    .desc-analysis {
      font-size: 14.5px;
      color: #6b6090;
      line-height: 1.85;
      margin-bottom: 14px;
    }
    .desc-game-label {
      font-size: 11px;
      font-weight: 700;
      color: #9280b8;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .desc-game-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .desc-game-tags span {
      background: linear-gradient(135deg, rgba(200,165,232,0.22), rgba(142,197,252,0.22));
      border: 1.5px solid #d8c8f0;
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: #5c4a8c;
    }
    .desc-also {
      font-size: 12.5px;
      color: #a898c8;
      line-height: 1.6;
    }
    .traits { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .trait {
      background: linear-gradient(135deg, #e8d5f5, #d6eeff);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #5c4a8c;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #e5d6f7, transparent);
      margin: 20px 0;
    }
    .sheets-status {
      text-align: center;
      font-size: 13px;
      color: #9280b8;
      margin-top: 12px;
      min-height: 20px;
    }
    .btn-game-info {
      width: 100%;
      padding: 13px;
      background: rgba(200,165,232,0.15);
      border: 2px solid #e5d6f7;
      border-radius: 14px;
      font-size: 14.5px;
      font-weight: 500;
      font-family: inherit;
      color: #5c4a8c;
      cursor: pointer;
      margin-bottom: 16px;
      transition: all 0.2s;
    }
    .btn-game-info:hover { background: rgba(200,165,232,0.28); border-color: #c8a5e8; }
    .sheets-guide {
      margin-top: 16px;
      padding: 14px 18px;
      background: rgba(237,232,245,0.5);
      border-radius: 12px;
      font-size: 13px;
      color: #7c6faa;
      line-height: 1.75;
      text-align: center;
    }
    /* ── 모달 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(80, 50, 130, 0.35);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-overlay.open { display: flex; animation: fadeIn 0.25s ease; }
    .modal-card {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px;
      width: 100%;
      max-width: 540px;
      max-height: 80vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 12px 48px rgba(80,50,130,0.18);
    }
    .modal-close {
      position: absolute;
      top: 16px; right: 18px;
      background: none;
      border: none;
      font-size: 18px;
      color: #9280b8;
      cursor: pointer;
      padding: 4px 8px;
    }
    .modal-close:hover { color: #5c4a8c; }
    .modal-game-title {
      font-size: 17px;
      font-weight: 700;
      color: #5c4a8c;
      margin: 28px 0 4px;
      padding-bottom: 8px;
      border-bottom: 2px solid #ede8f5;
    }
    .modal-game-title:first-child { margin-top: 0; }
    .modal-game-meta {
      font-size: 12px;
      color: #b09fcb;
      margin-bottom: 12px;
    }
    .modal-section {
      background: #f8f5ff;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .modal-section-label {
      font-size: 11px;
      font-weight: 700;
      color: #9280b8;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .modal-section-body {
      font-size: 13.5px;
      color: #4a3f6b;
      line-height: 1.75;
    }
    .modal-section-body b { color: #5c4a8c; }
    .modal-howto {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .modal-howto li {
      font-size: 13.5px;
      color: #4a3f6b;
      line-height: 1.65;
      padding-left: 16px;
      position: relative;
    }
    .modal-howto li::before {
      content: "›";
      position: absolute;
      left: 0;
      color: #c8a5e8;
      font-weight: 700;
    }
    .modal-howto li b { color: #5c4a8c; }
    /* ── 로딩 화면 ── */
    .loading-dice {
      font-size: 64px;
      display: block;
      margin-bottom: 28px;
      animation: diceFloat 0.8s ease-in-out infinite alternate;
    }
    @keyframes diceFloat {
      from { transform: translateY(0) rotate(-8deg); }
      to   { transform: translateY(-14px) rotate(8deg); }
    }
    .loading-text {
      font-size: 18px;
      font-weight: 600;
      color: #5c4a8c;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .loading-dots span {
      width: 11px;
      height: 11px;
      background: linear-gradient(135deg, #c8a5e8, #8ec5fc);
      border-radius: 50%;
      animation: dotPop 1.1s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.18s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dotPop {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-10px); opacity: 1; }
    }
    .btn-back {
      display: block;
      margin-bottom: 10px;
      padding: 5px 14px;
      border: 1.5px solid #e5d6f7;
      border-radius: 8px;
      background: rgba(255,255,255,0.7);
      font-size: 12.5px;
      font-family: inherit;
      color: #9280b8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-back:hover { border-color: #c8a5e8; color: #5c4a8c; background: rgba(200,165,232,0.15); }
    .btn-back.hidden { visibility: hidden; }
    .sheets-guide strong { color: #5c4a8c; }
    .sheets-guide code {
      background: rgba(200,165,232,0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- ① 시작 화면 -->
  <div class="screen active" id="screen-start">
    <div class="card">
      <span class="start-icon">🎲</span>
      <h1 class="start-title">L&D 보드게임 취향 테스트</h1>
      <p class="start-sub">10개의 질문으로 알아보는<br>플레이샵 찰떡 보드게임 고르기 ✨</p>
      <label class="name-label">이름을 입력해주세요</label>
      <input type="text" class="name-input" id="name-input" placeholder="이름 입력..." maxlength="10">
      <button class="btn-primary" onclick="startQuiz()">테스트 시작하기 →</button>
    </div>
  </div>

  <!-- ② 질문 화면 -->
  <div class="screen" id="screen-quiz">
    <button class="btn-back" id="btn-back" onclick="goBack()">← 이전</button>
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="prog-label">1 / 10</span>
          <span id="prog-pct">10%</span>
        </div>
        <div class="progress-bg">
          <div class="progress-fill" id="prog-bar" style="width:0%"></div>
        </div>
      </div>
      <p class="q-label" id="q-label">Q1.</p>
      <p class="q-text" id="q-text"></p>
      <div class="options" id="options"></div>
    </div>
  </div>

  <!-- ③ 로딩 화면 -->
  <div class="screen" id="screen-loading">
    <div class="card" style="text-align:center; padding: 64px 36px;">
      <span class="loading-dice">🎲</span>
      <p class="loading-text">당신에게 딱 맞는<br>플레이샵 게임을 찾는 중입니다...</p>
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- ④ 결과 화면 -->
  <div class="screen" id="screen-result">
    <div class="card">
      <div class="result-top">
        <span class="result-emoji"   id="r-emoji"></span>
        <p    class="result-name-line" id="r-name-line"></p>
        <p    class="result-type"     id="r-type"></p>
        <p    class="result-subtitle" id="r-subtitle"></p>
        <div  class="result-game-badge" id="r-game"></div>
      </div>
      <div  class="result-desc"  id="r-desc"></div>
      <div  class="traits"       id="r-traits"></div>
      <button class="btn-game-info" onclick="openGameModal()">📖 추천 게임 소개 보기</button>
      <div  class="divider"></div>
      <button class="btn-primary" onclick="restartQuiz()">🔄 다시 테스트하기</button>
      <p class="sheets-status" id="sheets-status"></p>
      <div class="sheets-guide">
        테스트에 응해주셔서 감사합니다 😊<br>
        6월 2일 플레이샵에서 만나요~~~!!
      </div>
    </div>
  </div>

  <!-- 게임 소개 모달 -->
  <div class="modal-overlay" id="modal-overlay" onclick="closeGameModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeGameModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

</div>
<script>
/* =====================================================
   구글 시트 연동 설정
   -----------------------------------------------------
   1. https://script.google.com 에서 새 프로젝트 생성
   2. 아래 Apps Script 코드를 붙여넣고 웹앱으로 배포
      (배포 > 새 배포 > 유형: 웹앱 > 누구나 액세스)
   3. 배포 URL을 GOOGLE_SCRIPT_URL 에 넣으면 완성!

   --- Apps Script 코드 (복사해서 사용) ---
   function doPost(e) {
     var ss    = SpreadsheetApp.getActiveSpreadsheet();
     var sheet = ss.getSheetByName('결과') || ss.getActiveSheet();
     var data  = JSON.parse(e.postData.contents);
     if (sheet.getLastRow() === 0) {
       sheet.appendRow(['시간','이름','선택답변','유형','칭호','추천게임']);
     }
     sheet.appendRow([
       data.timestamp, data.name,
       data.answers.join(' / '),
       data.resultType, data.resultTitle, data.resultGame
     ]);
     return ContentService
       .createTextOutput('OK')
       .setMimeType(ContentService.MimeType.TEXT);
   }
   ===================================================== */
const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSeUT8dR4Nidvi_8uCtRLPnVs2W9VqjPgPAjP4tAqb7Gn3LSpQ/formResponse';

/* ── 질문 데이터 ── */
const questions = [
  {
    q: "게임에서 가장 짜릿한 순간은?",
    opts: [
      { t: "😏 상대의 거짓말을 딱 잡아채고 역이용할 때",   type: "P" },
      { t: "💡 복잡한 단서를 연결해 정답을 맞혔을 때",     type: "D" },
      { t: "⚡ 누구보다 0.1초 빠르게 반응해 이겼을 때",    type: "R" },
      { t: "♟️ 처음부터 세운 전략이 딱 맞아떨어질 때",     type: "S" }
    ]
  },
  {
    q: "게임 중 어떤 시간이 제일 좋은가요?",
    opts: [
      { t: "😂 그냥 다 같이 왁자지껄 웃는 시간",           type: "F" },
      { t: "🏆 팀이 하나가 되어 함께 이기는 것",           type: "C" },
      { t: "🧩 머리를 맞대고 어려운 걸 풀어내는 것",       type: "D" },
      { t: "👑 전략을 짜고 판을 내 뜻대로 지배하는 것",    type: "S" }
    ]
  },
  {
    q: "나는 어떤 사람에 가장 가까운가요?",
    opts: [
      { t: "🔬 논리적으로 따지고 분석하는 걸 즐긴다",      type: "D" },
      { t: "🚀 생각보다 행동이 먼저 나오는 편이다",         type: "R" },
      { t: "👀 사람들의 속마음과 눈치를 잘 읽는다",        type: "P" },
      { t: "🎊 어딜 가든 분위기를 살리는 에너지형이다",    type: "F" }
    ]
  },
  {
    q: "게임 중 가장 짜증나는 상황은?",
    opts: [
      { t: "😤 순발력 싸움에서 계속 뒤처지는 것",           type: "R" },
      { t: "😔 팀원이 소통 없이 혼자 튀는 것",             type: "C" },
      { t: "💥 내 전략이 예상치 못한 변수로 무너지는 것",  type: "S" },
      { t: "😵 규칙이 너무 복잡해서 헷갈리는 것",          type: "F" }
    ]
  },
  {
    q: "좋아하는 영화/드라마 장르는?",
    opts: [
      { t: "🎭 심리 스릴러 (조커, 기생충)",                type: "P" },
      { t: "🔍 미스터리 추리 (나이브스 아웃, 셜록)",       type: "D" },
      { t: "🦑 함께 살아남는 생존물 (오징어게임)",          type: "C" },
      { t: "💨 빠른 전개의 액션 (미션 임파서블)",           type: "R" }
    ]
  },
  {
    q: "팀 게임에서 나의 이상적인 역할은?",
    opts: [
      { t: "🗺️ 사령관 — 전체 전략을 짜고 팀을 이끈다",     type: "S" },

/* ── 상태 ── */
let userName     = '';
let curQ         = 0;
let scores       = {};
let answers      = [];
let answerTypes  = [];

/* ── 화면 전환 ── */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ── 시작 ── */
function startQuiz() {
  const inp = document.getElementById('name-input');
  userName  = inp.value.trim();
  if (!userName) { inp.classList.add('error'); inp.focus(); return; }
  inp.classList.remove('error');
  curQ        = 0;
  scores      = { P:0, D:0, R:0, S:0, C:0, F:0 };
  answers     = [];
  answerTypes = [];
  show('screen-quiz');
  renderQ();
}

/* ── 질문 렌더 ── */
function renderQ() {
  const data  = questions[curQ];
  const total = questions.length;
  const pct   = Math.round((curQ / total) * 100);

  document.getElementById('prog-label').textContent = `${curQ + 1} / ${total}`;
  document.getElementById('prog-pct').textContent   = `${pct}%`;
  document.getElementById('prog-bar').style.width   = `${pct}%`;
  document.getElementById('q-label').textContent    = `Q${curQ + 1}.`;
  document.getElementById('q-text').textContent     = data.q;
  document.getElementById('btn-back').classList.toggle('hidden', curQ === 0);

  const box = document.getElementById('options');
  box.innerHTML = '';
  data.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className   = 'opt-btn';
    btn.textContent = opt.t;
    btn.onclick = () => pick(opt.type, opt.t, btn);
    box.appendChild(btn);
  });
}

/* ── 선택 ── */
function pick(type, text, btn) {
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  scores[type]++;
  answers.push(text);
  answerTypes.push(type);
  curQ++;

  if (curQ >= questions.length) {
    document.getElementById('prog-bar').style.width = '100%';
    document.getElementById('prog-pct').textContent = '100%';
    document.getElementById('prog-label').textContent = `${questions.length} / ${questions.length}`;
    setTimeout(() => {
      show('screen-loading');
      setTimeout(() => showResult(), 2200);
    }, 500);
  } else {
    setTimeout(() => renderQ(), 380);
  }
}

/* ── 뒤로 가기 ── */
function goBack() {
  if (curQ === 0) return;
  const lastType = answerTypes.pop();
  answers.pop();
  scores[lastType]--;
  curQ--;
  renderQ();
}

/* ── 결과 표시 ── */
function showResult() {
  const topType = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  currentResultType = topType;
  const r = RESULTS[topType];

  document.getElementById('r-emoji').textContent    = r.emoji;
  document.getElementById('r-name-line').textContent = `${userName}님의 찰떡 보드게임 유형은`;
  document.getElementById('r-type').textContent     = r.title;
  document.getElementById('r-subtitle').textContent = r.subtitle;
  document.getElementById('r-game').textContent     = `추천 게임: ${r.game}`;
  document.getElementById('r-desc').innerHTML       = r.desc;
  document.getElementById('r-traits').innerHTML     =
    r.traits.map(t => `<span class="trait">${t}</span>`).join('');

  show('screen-result');
  sendToSheets(userName, answers, topType, r);
}

/* ── 구글 시트 전송 ── */
async function sendToSheets(name, ans, type, r) {
  const status = document.getElementById('sheets-status');
  status.textContent = '📤 결과를 저장하는 중...';
  try {
    const body = new URLSearchParams();
    body.append('entry.150478233',  name);
    body.append('entry.1312031319', ans.join(' / '));
    body.append('entry.123724454',  type);
    body.append('entry.1255809463', r.title);
    body.append('entry.135090334',  r.game);
    body.append('entry.1670242402', new Date().toLocaleString('ko-KR'));

    await fetch(FORM_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: body
    });
    status.textContent = '✅ 결과가 구글 시트에 저장되었습니다!';
  } catch (err) {
    status.textContent = '⚠️ 저장 중 오류가 발생했습니다.';
    console.error('[구글 시트 전송 실패]', err);
  }
}

/* ── 재시작 ── */
function restartQuiz() {
  document.getElementById('name-input').value = '';
  show('screen-start');
}

/* ── 게임 소개 모달 ── */
let currentResultType = null;

function openGameModal() {
  const r = RESULTS[currentResultType];
  if (!r) return;
  const content = r.gameInfo.map(g => `
    <p class="modal-game-title">${g.name}</p>
    <p class="modal-game-meta">${g.meta}</p>
    <div class="modal-section">
      <div class="modal-section-label">🎯 목적</div>
      <div class="modal-section-body">${g.purpose}</div>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">▶ 진행 방식</div>
      <ul class="modal-howto">${g.howto.map(h => `<li>${h}</li>`).join('')}</ul>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">💡 포인트</div>
      <div class="modal-section-body">${g.point}</div>
    </div>
  `).join('');
  document.getElementById('modal-content').innerHTML = content;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeGameModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('name-input')
  .addEventListener('keydown', e => { if (e.key === 'Enter') startQuiz(); });
</script>
