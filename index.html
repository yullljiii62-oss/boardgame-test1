<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎲 보드게임 성향 테스트</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffeef8 0%, #e8f4ff 50%, #f0fff4 100%);
      background-size: 300% 300%;
      animation: bgShift 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    @keyframes bgShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container { width: 100%; max-width: 580px; }

    /* ── 화면 전환 ── */
    .screen { display: none; }
    .screen.active {
      display: block;
      animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 카드 ── */
    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: 0 8px 40px rgba(120, 80, 180, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    /* ── 시작 화면 ── */
    .start-icon {
      font-size: 70px;
      text-align: center;
      display: block;
      margin-bottom: 14px;
      animation: floatBounce 2.4s ease-in-out infinite;
    }
    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }
    .start-title {
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #5c4a8c;
      margin-bottom: 8px;
    }
    .start-sub {
      text-align: center;
      font-size: 14.5px;
      color: #9280b8;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .name-label {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      color: #7c6faa;
      margin-bottom: 8px;
    }
    .name-input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e5d6f7;
      border-radius: 14px;
      font-size: 16px;
      font-family: inherit;
      color: #3d3060;
      background: rgba(255,255,255,0.9);
      outline: none;
      transition: border-color 0.25s;
      margin-bottom: 22px;
    }
    .name-input:focus { border-color: #b99bd6; }
    .name-input.error { border-color: #f9a8d4; }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #c8a5e8 0%, #8ec5fc 100%);
      border: none;
      border-radius: 14px;
      font-size: 16.5px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(176, 137, 220, 0.38);
    }

    /* ── 진행 바 ── */
    .progress-wrap { margin-bottom: 28px; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: #9a8fba;
      margin-bottom: 8px;
    }
    .progress-bg {
      width: 100%;
      height: 10px;
      background: #ede8f5;
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #c8a5e8, #8ec5fc, #a8f0db);
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── 질문 화면 ── */
    .q-label {
      font-size: 12.5px;
      font-weight: 500;
      color: #b09fcb;
      margin-bottom: 10px;
    }
    .q-text {
      font-size: 19px;
      font-weight: 700;
      color: #3d3060;
      line-height: 1.55;
      margin-bottom: 26px;
    }
    .options { display: flex; flex-direction: column; gap: 11px; }
    .opt-btn {
      padding: 15px 20px;
      border: 2px solid #e5d6f7;
      border-radius: 14px;
      background: rgba(255,255,255,0.75);
      font-size: 14.5px;
      font-family: inherit;
      color: #4a3f6b;
      cursor: pointer;
      text-align: left;
      line-height: 1.5;
      transition: all 0.22s;
    }
    .opt-btn:hover {
      border-color: #c8a5e8;
      background: rgba(200, 165, 232, 0.13);
      transform: translateX(5px);
    }
    .opt-btn.selected {
      border-color: #c8a5e8;
      background: linear-gradient(135deg, rgba(200,165,232,0.22), rgba(142,197,252,0.22));
      color: #5c4a8c;
      font-weight: 500;
      transform: translateX(5px);
    }

    /* ── 결과 화면 ── */
    .result-top { text-align: center; margin-bottom: 24px; }
    .result-emoji {
      font-size: 76px;
      display: block;
      margin-bottom: 14px;
      animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.3); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .result-name-line { font-size: 15px; color: #9a8fba; margin-bottom: 6px; }
    .result-type { font-size: 25px; font-weight: 700; color: #5c4a8c; margin-bottom: 6px; }
    .result-subtitle { font-size: 13.5px; color: #9280b8; margin-bottom: 14px; }
    .result-game-badge {
      display: inline-block;
      background: linear-gradient(135deg, #ffd6e7, #c7f2ff);
      border-radius: 100px;
      padding: 7px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #5c4a8c;
    }
    .result-desc {
      font-size: 14.5px;
      color: #6b6090;
      line-height: 1.85;
      background: rgba(237,232,245,0.45);
      border-radius: 14px;
      padding: 18px 20px;
      margin: 20px 0;
    }
    .traits { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .trait {
      background: linear-gradient(135deg, #e8d5f5, #d6eeff);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #5c4a8c;
    }
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #e5d6f7, transparent);
      margin: 20px 0;
    }
    .sheets-status {
      text-align: center;
      font-size: 13px;
      color: #9280b8;
      margin-top: 12px;
      min-height: 20px;
    }
    .sheets-guide {
      margin-top: 20px;
      padding: 16px 18px;
      background: rgba(237,232,245,0.5);
      border-radius: 12px;
      font-size: 13px;
      color: #7c6faa;
      line-height: 1.75;
    }
    .sheets-guide strong { color: #5c4a8c; }
    .sheets-guide code {
      background: rgba(200,165,232,0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- ① 시작 화면 -->
  <div class="screen active" id="screen-start">
    <div class="card">
      <span class="start-icon">🎲</span>
      <h1 class="start-title">보드게임 성향 테스트</h1>
      <p class="start-sub">10개의 질문으로 알아보는<br>나의 찰떡 보드게임 유형 ✨</p>
      <label class="name-label">이름을 알려주세요</label>
      <input type="text" class="name-input" id="name-input" placeholder="이름 입력..." maxlength="10">
      <button class="btn-primary" onclick="startQuiz()">테스트 시작하기 →</button>
    </div>
  </div>

  <!-- ② 질문 화면 -->
  <div class="screen" id="screen-quiz">
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="prog-label">1 / 10</span>
          <span id="prog-pct">10%</span>
        </div>
        <div class="progress-bg">
          <div class="progress-fill" id="prog-bar" style="width:10%"></div>
        </div>
      </div>
      <p class="q-label" id="q-label">Q1.</p>
      <p class="q-text"  id="q-text"></p>
      <div class="options" id="options"></div>
    </div>
  </div>

  <!-- ③ 결과 화면 -->
  <div class="screen" id="screen-result">
    <div class="card">
      <div class="result-top">
        <span class="result-emoji"   id="r-emoji"></span>
        <p    class="result-name-line" id="r-name-line"></p>
        <p    class="result-type"     id="r-type"></p>
        <p    class="result-subtitle" id="r-subtitle"></p>
        <div  class="result-game-badge" id="r-game"></div>
      </div>
      <p    class="result-desc"  id="r-desc"></p>
      <div  class="traits"       id="r-traits"></div>
      <div  class="divider"></div>
      <button class="btn-primary" onclick="restartQuiz()">🔄 다시 테스트하기</button>
      <p class="sheets-status" id="sheets-status"></p>
      <div class="sheets-guide">
        📋 테스트 결과는 구글 폼을 통해 스프레드시트에 자동 저장됩니다.
      </div>
    </div>
  </div>

</div>
<script>
/* =====================================================
   구글 시트 연동 설정
   -----------------------------------------------------
   1. https://script.google.com 에서 새 프로젝트 생성
   2. 아래 Apps Script 코드를 붙여넣고 웹앱으로 배포
      (배포 > 새 배포 > 유형: 웹앱 > 누구나 액세스)
   3. 배포 URL을 GOOGLE_SCRIPT_URL 에 넣으면 완성!

   --- Apps Script 코드 (복사해서 사용) ---
   function doPost(e) {
     var ss    = SpreadsheetApp.getActiveSpreadsheet();
     var sheet = ss.getSheetByName('결과') || ss.getActiveSheet();
     var data  = JSON.parse(e.postData.contents);
     if (sheet.getLastRow() === 0) {
       sheet.appendRow(['시간','이름','선택답변','유형','칭호','추천게임']);
     }
     sheet.appendRow([
       data.timestamp, data.name,
       data.answers.join(' / '),
       data.resultType, data.resultTitle, data.resultGame
     ]);
     return ContentService
       .createTextOutput('OK')
       .setMimeType(ContentService.MimeType.TEXT);
   }
   ===================================================== */

    subtitle: "한 수 앞을 내다보며 판을 지배하는 타입",
    game: "🏝️ 카탄 (Catan)",
    desc: "한 수, 두 수 앞을 내다보는 전략의 달인! 자원을 효율적으로 관리하고 장기 계획으로 상대를 압도해요. 개척·거래·협상이 복합적으로 얽힌 '카탄'에서 독보적인 실력을 발휘할 거예요. 티켓 투 라이드, 7원더스도 추천!",
    traits: ["장기적 사고", "자원 관리 능력", "계획 실행력", "냉정한 판단"]
  },
  C: {
    emoji: "🤝",
    title: "팀의 심장",
    subtitle: "혼자보다 함께할 때 더 빛나는 협동의 달인",
    game: "🦠 팬데믹 (Pandemic)",
    desc: "혼자 이기는 것보다 함께 이기는 게 더 기쁜 당신! 팀원의 강점을 살리고 소통을 이끄는 리더십이 빛나요. 전 인류를 구하기 위해 협력해야 하는 '팬데믹'에서 당신이 없으면 게임이 안 돌아가요. 스피릿 아일랜드, 갈라파고스도 도전해보세요!",
    traits: ["강한 팀워크", "배려와 소통", "상황 조율 능력", "희생 정신"]
  }
};

/* ── 상태 ── */
let userName = '';
let curQ     = 0;
let scores   = {};
let answers  = [];

/* ── 화면 전환 ── */
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ── 시작 ── */
function startQuiz() {
  const inp = document.getElementById('name-input');
  userName  = inp.value.trim();
  if (!userName) { inp.classList.add('error'); inp.focus(); return; }
  inp.classList.remove('error');
  curQ    = 0;
  scores  = { P:0, D:0, R:0, S:0, C:0 };
  answers = [];
  show('screen-quiz');
  renderQ();
}

/* ── 질문 렌더 ── */
function renderQ() {
  const data  = questions[curQ];
  const total = questions.length;
  const pct   = Math.round(((curQ + 1) / total) * 100);

  document.getElementById('prog-label').textContent = `${curQ + 1} / ${total}`;
  document.getElementById('prog-pct').textContent   = `${pct}%`;
  document.getElementById('prog-bar').style.width   = `${pct}%`;
  document.getElementById('q-label').textContent    = `Q${curQ + 1}.`;
  document.getElementById('q-text').textContent     = data.q;

  const box = document.getElementById('options');
  box.innerHTML = '';
  data.opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className   = 'opt-btn';
    btn.textContent = opt.t;
    btn.onclick = () => pick(opt.type, opt.t, btn);
    box.appendChild(btn);
  });
}

/* ── 선택 ── */
function pick(type, text, btn) {
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  scores[type]++;
  answers.push(text);
  setTimeout(() => {
    curQ++;
    curQ < questions.length ? renderQ() : showResult();
  }, 380);
}

/* ── 결과 표시 ── */
function showResult() {
  const topType = Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  const r = RESULTS[topType];

  document.getElementById('r-emoji').textContent    = r.emoji;
  document.getElementById('r-name-line').textContent = `${userName}님의 찰떡 보드게임 유형은`;
  document.getElementById('r-type').textContent     = r.title;
  document.getElementById('r-subtitle').textContent = r.subtitle;
  document.getElementById('r-game').textContent     = `추천 게임: ${r.game}`;
  document.getElementById('r-desc').textContent     = r.desc;
  document.getElementById('r-traits').innerHTML     =
    r.traits.map(t => `<span class="trait">${t}</span>`).join('');

  show('screen-result');
  sendToSheets(userName, answers, topType, r);
}

/* ── 구글 시트 전송 ── */
async function sendToSheets(name, ans, type, r) {
  const status = document.getElementById('sheets-status');
  status.textContent = '📤 결과를 저장하는 중...';
  try {
    const body = new URLSearchParams();
    body.append('entry.150478233',  name);
    body.append('entry.1312031319', ans.join(' / '));
    body.append('entry.123724454',  type);
    body.append('entry.1255809463', r.title);
    body.append('entry.135090334',  r.game);
    body.append('entry.1670242402', new Date().toLocaleString('ko-KR'));

    await fetch(FORM_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: body
    });
    status.textContent = '✅ 결과가 구글 시트에 저장되었습니다!';
  } catch (err) {
    status.textContent = '⚠️ 저장 중 오류가 발생했습니다.';
    console.error('[구글 시트 전송 실패]', err);
  }
}

/* ── 재시작 ── */
function restartQuiz() {
  document.getElementById('name-input').value = '';
  show('screen-start');
}

document.getElementById('name-input')
  .addEventListener('keydown', e => { if (e.key === 'Enter') startQuiz(); });
</script>
